name: Automated Site Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-checks:
    name: HTML and SEO basics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run dependency-free checks
        run: python scripts/automated_checks.py
